<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muhammad Awais, AI Engineer. AI systems, built for real work.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b24"/>
      <stop offset="1" stop-color="#13293a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#f2a33a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a33a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f3efe6;letter-spacing:-1px}
      .title{font:600 26px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f2a33a}
      .line{font:400 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#a9bcc6}
      .edge{stroke:#2f5466;stroke-width:2;fill:none}
      .pulse{stroke:#f2a33a;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:14 100;animation:run 3.2s linear infinite}
      .p2{animation-delay:-1.1s}.p3{animation-delay:-2.2s}.p4{animation-delay:-0.6s}
      .node{fill:#13293a;stroke:#4d7a8f;stroke-width:2}
      .hub{fill:#f2a33a;animation:beat 2.4s ease-in-out infinite;transform-origin:960px 160px}
      .lamp{animation:blink 2.4s ease-in-out infinite}
      .l2{animation-delay:-.8s}.l3{animation-delay:-1.6s}
      .rise{opacity:0;animation:in .9s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}
      @keyframes run{from{stroke-dashoffset:114}to{stroke-dashoffset:0}}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <g class="rise d1"><text x="70" y="140" class="name">Muhammad Awais</text></g>
  <g class="rise d2"><text x="72" y="186" class="title">AI Engineer</text></g>
  <g class="rise d3">
    <text x="72" y="228" class="line">Full-stack products · Agentic workflows · Business automation</text>
    <text x="72" y="262" class="line">AI systems. Built for real work.</text>
  </g>

  <!-- an agent hub wired to the tools it drives -->
  <path class="edge" d="M960 160 L840 70"/>
  <path class="edge" d="M960 160 L1110 80"/>
  <path class="edge" d="M960 160 L850 250"/>
  <path class="edge" d="M960 160 L1100 250"/>
  <path pathLength="100" class="pulse" d="M960 160 L840 70"/>
  <path pathLength="100" class="pulse p2" d="M960 160 L1110 80"/>
  <path pathLength="100" class="pulse p3" d="M960 160 L850 250"/>
  <path pathLength="100" class="pulse p4" d="M960 160 L1100 250"/>
  <circle cx="840" cy="70" r="16" class="node"/>
  <circle cx="1110" cy="80" r="16" class="node"/>
  <circle cx="850" cy="250" r="16" class="node"/>
  <circle cx="1100" cy="250" r="16" class="node"/>
  <circle cx="840" cy="70" r="5" fill="#5cc98f" class="lamp"/>
  <circle cx="1110" cy="80" r="5" fill="#f2a33a" class="lamp l2"/>
  <circle cx="850" cy="250" r="5" fill="#5cc98f" class="lamp l3"/>
  <circle cx="1100" cy="250" r="5" fill="#5cc98f" class="lamp"/>
  <circle cx="960" cy="160" r="30" fill="#0d1b24" stroke="#f2a33a" stroke-width="2"/>
  <circle cx="960" cy="160" r="11" class="hub"/>
</svg>
